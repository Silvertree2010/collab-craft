[package]
name = "collabcraft-share"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A craft-ui share backend that reaches the CollabCraft service, on the desktop and in the browser"

[lints]
workspace = true

[dependencies]
# The dialog's contract. No transport comes with it, which is the point.
craft-ui = { workspace = true, features = ["share"] }
craft-cloud = { workspace = true }
craft-cloud-client = { workspace = true }

# A browser has no thread to put the waiting on, and the dialog's contract is
# already fire and forget. So a request becomes a task that answers through the
# Replier whenever the fetch resolves.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }

[dev-dependencies]
# Only the tests read a request body back, to show what was posted.
serde_json = { workspace = true }
